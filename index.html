    <!-- CODE LOGIC ARCHITECTURE -->
    <script>
        // Launches the game/site inside the full viewport
        function launchApp(url) {
            document.getElementById('hub-container').style.display = 'none';
            document.getElementById('runner-container').style.display = 'block';
            let frame = document.getElementById('app-runner');
            frame.src = url;
        }

        // Exits the fullscreen layout back to your dashboard grid
        function closeApp() {
            document.getElementById('hub-container').style.display = 'block';
            document.getElementById('runner-container').style.display = 'none';
            let frame = document.getElementById('app-runner');
            frame.src = "";
        }

        // Live filtration search script
        function filterApps() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            for (let i = 0; i < cards.length; i++) {
                let nameAttr = cards[i].getAttribute('data-name');
                if (nameAttr.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Invisible background container spoofer (about:blank injection)
        function cloakTab() {
            let currentUrl = window.location.href;
            let targetWin = window.open('about:blank', '_blank');
            if (targetWin) {
                let doc = targetWin.document;
                doc.body.style.margin = '0';
                doc.body.style.height = '100vh';
                doc.body.style.overflow = 'hidden';
                doc.title = "Google Classroom";
                
                let link = doc.createElement('link');
                link.rel = 'icon';
                link.type = 'image/x-icon';
                link.href = 'https://gstatic.com';
                doc.head.appendChild(link);
                
                let proxyFrame = doc.createElement('iframe');
                proxyFrame.style.border = 'none';
                proxyFrame.style.width = '100%';
                proxyFrame.style.height = '100%';
                proxyFrame.src = currentUrl;
                doc.body.appendChild(proxyFrame);
                
                window.location.replace("https://google.com");
            } else {
                alert("Please enable popup windows for this site to configure the cloaking system!");
            }
        }

        // Tilde / Backtick instantaneous escape route trigger
        window.addEventListener('keydown', function(event) {
            if (event.key === '`' || event.keyCode === 192) {
                window.location.replace("https://google.com");
            }
        });
    </script>
</body>
</html>
